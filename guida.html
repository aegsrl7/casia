        :root {
            --rame: #B8956B;
            --rame-light: #D4B896;
            --rame-dark: #9A7B56;
            --antracite: #2D2926;
            --crema: #F8F5F0;
            --carta: #FDFBF8;
            --testo-soft: #5a5652;
            --bordo: #ECE5DA;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Jost', -apple-system, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-body);
            background: #EFE9E0;
            color: var(--antracite);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            font-weight: 300;
        }
        .app {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            background: var(--crema);
            position: relative;
        }
        @media (min-width: 520px) {
            body { padding: 32px 0; }
            .app { min-height: calc(100vh - 64px); border-radius: 24px; box-shadow: 0 20px 60px rgba(45,41,38,0.12); overflow: hidden; }
        }

        /* ---------- Lingue ---------- */
        .langs {
            display: flex; justify-content: flex-end; gap: 4px;
            padding: 18px 20px 0;
        }
        .lang-b {
            font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 1px;
            border: 1px solid transparent; background: transparent; color: var(--testo-soft);
            padding: 5px 9px; border-radius: 99px; cursor: pointer;
        }
        .lang-b.on { background: var(--antracite); color: var(--crema); }

        /* ---------- Home ---------- */
        .home { padding: 8px 20px 40px; }
        .logo { display: block; margin: 6px auto 14px; width: 84px; }
        .h-title {
            font-family: var(--font-display); font-style: italic; font-weight: 500;
            font-size: 2rem; color: var(--rame-dark); text-align: center;
        }
        .h-sep {
            width: 150px; margin: 10px auto 12px; display: flex; align-items: center; gap: 8px;
        }
        .h-sep::before, .h-sep::after { content: ''; flex: 1; height: 1px; background: var(--rame-light); }
        .h-sep span { width: 5px; height: 5px; background: var(--rame-light); transform: rotate(45deg); }
        .h-name { text-align: center; font-weight: 400; font-size: 1.05rem; letter-spacing: 0.5px; }
        .h-place {
            text-align: center; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            color: var(--testo-soft); margin-top: 5px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-top: 28px;
        }
        .tile {
            background: var(--carta); border: 1px solid var(--bordo); border-radius: 16px;
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0; cursor: pointer; text-decoration: none; color: inherit;
            transition: transform 150ms ease, box-shadow 150ms ease;
            padding: 8px 4px;
        }
        .tile:active { transform: scale(0.96); }
        @media (hover: hover) { .tile:hover { box-shadow: 0 6px 18px rgba(45,41,38,0.08); } }
        .tile svg { width: 30px; height: 30px; stroke: var(--rame); flex: 0 0 auto; }
        .tile em {
            font-style: normal; font-size: 0.58rem; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--testo-soft); text-align: center; margin-top: 10px; line-height: 1.35;
        }
        .h-foot {
            margin-top: 34px; text-align: center;
            font-family: var(--font-display); font-style: italic; font-size: 1.05rem; color: var(--rame-dark);
        }
        .h-contact { text-align: center; font-size: 0.75rem; color: var(--testo-soft); margin-top: 8px; line-height: 1.7; }
        .h-contact a { color: var(--testo-soft); }

        /* ---------- Pannelli ---------- */
        .panel { display: none; padding-bottom: 44px; }
        .p-head {
            position: sticky; top: 0; z-index: 5;
            display: flex; align-items: center; gap: 12px;
            background: rgba(248,245,240,0.94); backdrop-filter: blur(6px);
            padding: 14px 16px; border-bottom: 1px solid var(--bordo);
        }
        .back {
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--bordo);
            background: var(--carta); cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex: 0 0 auto;
        }
        .back svg { width: 16px; height: 16px; stroke: var(--antracite); }
        .p-ico {
            width: 34px; height: 34px; border-radius: 10px; background: #F1E9DD;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
        }
        .p-ico svg { width: 18px; height: 18px; stroke: var(--rame-dark); }
        .p-head h2 { font-family: var(--font-body); font-weight: 400; font-size: 1rem; }
        .p-body { padding: 20px 20px 0; }
        .intro { color: var(--testo-soft); font-size: 0.92rem; line-height: 1.65; margin-bottom: 18px; }

        .card {
            background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px;
            padding: 4px 16px; margin-bottom: 18px;
        }
        .kv {
            display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid var(--bordo);
        }
        .kv:last-child { border-bottom: none; }
        .kv b { font-weight: 400; font-size: 1.05rem; white-space: nowrap; }
        .kv span { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--testo-soft); }

        .sub {
            font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; color: var(--rame-dark);
            display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
        }
        .sub::after { content: ''; flex: 1; height: 1px; background: var(--bordo); }

        .steps { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 2px 16px; margin-bottom: 18px; }
        .step { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--bordo); font-size: 0.92rem; line-height: 1.55; }
        .step:last-child { border-bottom: none; }
        .step i {
            font-style: normal; flex: 0 0 auto; width: 22px; height: 22px; border: 1px solid var(--rame-light);
            border-radius: 50%; color: var(--rame-dark); font-size: 0.72rem;
            display: flex; align-items: center; justify-content: center; margin-top: 1px;
        }
        .chip { background: #F1E9DD; border-radius: 6px; padding: 1px 7px; font-weight: 400; white-space: nowrap; }

        .list { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 2px 16px; margin-bottom: 18px; }
        .place { padding: 13px 0; border-bottom: 1px solid var(--bordo); }
        .place:last-child { border-bottom: none; }
        .place b { font-weight: 400; font-size: 0.95rem; }
        .place p { font-size: 0.82rem; color: var(--testo-soft); line-height: 1.55; margin-top: 3px; }
        .place p a { color: var(--rame-dark); text-decoration: none; }
        .place .note { font-size: 0.78rem; color: var(--rame-dark); font-style: italic; margin-top: 2px; }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 9px;
            background: var(--antracite); color: var(--crema); border: none; border-radius: 12px;
            font-family: var(--font-body); font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 15px 18px; width: 100%; cursor: pointer; text-decoration: none; margin-bottom: 12px;
        }
        .btn svg { width: 16px; height: 16px; stroke: var(--crema); }
        .btn.ghost { background: transparent; color: var(--antracite); border: 1px solid var(--antracite); }
        .btn.ghost svg { stroke: var(--antracite); }

        ul.plain { list-style: none; }
        ul.plain li { display: flex; gap: 10px; padding: 8px 0; font-size: 0.92rem; line-height: 1.55; }
        ul.plain li::before { content: ''; flex: 0 0 auto; width: 5px; height: 5px; background: var(--rame); transform: rotate(45deg); margin-top: 9px; }

        .em-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        .em {
            background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px;
            text-align: center; padding: 14px 6px; text-decoration: none; color: inherit;
        }
        .em b { font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; color: var(--rame-dark); }
        .em span { display: block; font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--testo-soft); margin-top: 3px; }
    </style>
</head>

    var TILES = [
        ['checkin', 'key'], ['wifi', 'wifi'], ['arrivo', 'pin'],
        ['casa', 'home'], ['piscina', 'pool'], ['regole', 'rules'],
        ['spesa', 'cart'], ['bar', 'drink'], ['cena', 'food'],
        ['fare', 'map'], ['numeri', 'phone'], ['contatti', 'chat']
    ];

    var lang = (function() {
        var q = new URLSearchParams(location.search).get('lang');
        var saved = null;
        try { saved = localStorage.getItem('guida-lang'); } catch (e) {}
        var l = q || saved || (navigator.language || 'it').slice(0, 2);
        return T[l] ? l : 'it';
    })();

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
    function telLink(t) { return '<a href="tel:' + t.replace(/\s/g, '') + '">' + t + '</a>'; }
    function placeList(items, L) {
        var h = '<div class="list">';
        items.forEach(function(p) {
            h += '<div class="place"><b>' + esc(p.n) + '</b><p>' + esc(p.a) + (p.t ? ' · ' + telLink(p.t) : '') + '</p><p class="note">' + esc(p.c[L]) + '</p></div>';
        });
        return h + '</div>';
    }
    function bullets(arr) {
        return '<ul class="plain">' + arr.map(function(x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }

    function sectionHTML(key, L) {
        var t = T[L];
        switch (key) {
            case 'checkin':
                return '<p class="intro">' + t.checkin.intro + '</p>' +
                    '<div class="card"><div class="kv"><span>' + t.checkin.inLbl + '</span><b>15:00</b></div>' +
                    '<div class="kv"><span>' + t.checkin.outLbl + '</span><b>10:00</b></div></div>' +
                    '<div class="sub">' + t.checkin.docsT + '</div><p class="intro">' + t.checkin.docs + '</p>';
            case 'wifi':
                return '<p class="intro">' + t.wifi.intro + '</p>' +
                    '<div class="card"><div class="kv"><span>' + t.wifi.netLbl + '</span><b>' + t.wifi.net + '</b></div></div>' +
                    '<p class="intro">' + t.wifi.pw + '</p>' +
                    '<a class="btn ghost" href="' + WA_URL + '">' + ICONS.wa + t.contatti.waBtn + '</a>';
            case 'arrivo':
                var steps = '<div class="steps">';
                t.arrivo.steps.forEach(function(s, i) { steps += '<div class="step"><i>' + (i + 1) + '</i><div>' + s + '</div></div>'; });
                steps += '</div>';
                return '<p class="intro">' + t.arrivo.intro + '</p>' +
                    '<a class="btn" href="' + MAPS_URL + '" target="_blank" rel="noopener">' + ICONS.maps + t.arrivo.mapsBtn + '</a>' +
                    '<div class="sub">' + t.arrivo.stepsT + '</div>' + steps +
                    '<div class="sub">' + t.arrivo.parkT + '</div><p class="intro">' + t.arrivo.park + '</p>';
            case 'casa':
                return '<p class="intro">' + t.casa.intro + '</p>' + bullets(t.casa.list) +
                    '<div class="sub">' + t.casa.helpT + '</div><p class="intro">' + t.casa.help + '</p>' +
                    '<a class="btn ghost" href="' + WA_URL + '">' + ICONS.wa + t.contatti.waBtn + '</a>';
            case 'piscina':
                return '<p class="intro">' + t.piscina.intro + '</p>' + bullets(t.piscina.list);
            case 'regole':
                return '<p class="intro">' + t.regole.intro + '</p>' + bullets(t.regole.list);
            case 'numeri':
                var em = '<div class="em-grid">';
                t.numeri.em.forEach(function(e) { em += '<a class="em" href="tel:' + e[0] + '"><b>' + e[0] + '</b><span>' + e[1] + '</span></a>'; });
                em += '</div>';
                return '<p class="intro">' + t.numeri.intro + '</p>' + em +
                    '<div class="sub">' + t.numeri.pharmaT + '</div>' + placeList([PHARMA], L);
            case 'spesa':
                return '<p class="intro">' + t.spesa.intro + '</p>' + placeList(SHOPS, L);
            case 'bar':
                return '<p class="intro">' + t.bar.intro + '</p>' + placeList(BARS, L);
            case 'cena':
                return '<p class="intro">' + t.cena.intro + '</p>' + placeList(REST, L);
            case 'fare':
                var h = '<p class="intro">' + t.fare.intro + '</p><div class="list">';
                t.fare.list.forEach(function(x) { h += '<div class="place"><b>' + x[0] + '</b><p>' + x[1] + '</p></div>'; });
                return h + '</div>';
            case 'contatti':
                return '<p class="intro">' + t.contatti.intro + '</p>' +
                    '<a class="btn" href="' + WA_URL + '">' + ICONS.wa + t.contatti.waBtn + '</a>' +
                    '<a class="btn ghost" href="tel:+393514321088">' + ICONS.phone + t.contatti.telBtn + '</a>' +
                    '<a class="btn ghost" href="mailto:info@casiavacanze.com">' + ICONS.chat + t.contatti.mailBtn + '</a>';
        }
        return '';
    }

    var grid = document.getElementById('grid');
    var panels = document.getElementById('panels');
    var home = document.getElementById('home');

    function render() {
        var t = T[lang];
        document.documentElement.lang = lang;
        document.querySelector('[data-g="title"]').textContent = t.title;
        document.querySelector('[data-g="foot"]').textContent = t.foot;

        grid.innerHTML = '';
        panels.innerHTML = '';
        TILES.forEach(function(pair) {
            var key = pair[0], ico = pair[1];
            var a = document.createElement('a');
            a.className = 'tile';
            a.href = '#' + key;
            a.innerHTML = ICONS[ico] + '<em>' + t.tiles[key] + '</em>';
            grid.appendChild(a);

            var p = document.createElement('div');
            p.className = 'panel';
            p.id = 'panel-' + key;
            p.innerHTML =
                '<div class="p-head"><button class="back" aria-label="' + t.back + '">' + ICONS.back + '</button>' +
                '<div class="p-ico">' + ICONS[ico] + '</div><h2>' + t.tiles[key] + '</h2></div>' +
                '<div class="p-body">' + sectionHTML(key, lang) + '</div>';
            p.querySelector('.back').addEventListener('click', function() { history.back(); });
            panels.appendChild(p);
        });

        document.querySelectorAll('.lang-b').forEach(function(b) {
            b.classList.toggle('on', b.dataset.lang === lang);
        });
        route();
    }

    function route() {
        var key = location.hash.replace('#', '');
        var target = key && document.getElementById('panel-' + key);
        document.querySelectorAll('.panel').forEach(function(p) { p.style.display = 'none'; });
        if (target) {
            home.style.display = 'none';
            document.getElementById('langs').style.display = 'none';
            target.style.display = 'block';
            window.scrollTo(0, 0);
        } else {
            home.style.display = 'block';
            document.getElementById('langs').style.display = 'flex';
        }
    }

    document.querySelectorAll('.lang-b').forEach(function(b) {
        b.addEventListener('click', function() {
            lang = b.dataset.lang;
            try { localStorage.setItem('guida-lang', lang); } catch (e) {}
            render();
        });
    });

    window.addEventListener('hashchange', route);
    render();
})();
